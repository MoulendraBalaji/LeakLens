<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LeakLens — 100% on-device credential and secret scanner. Real-time air-gapped detection with zero network calls.">
  <meta name="theme-color" content="#101014">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LeakLens">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Crisp Favicons (Vector SVG + Transparent PNG) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">

  <!-- Google Fonts: Plus Jakarta Sans (Google Sans geometry) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <title>LeakLens — On-Device Secret Scanner</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080B10;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080B10;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .brand-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      animation: pulse-glow 2s infinite ease-in-out;
    }
    .brand-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4285F4 0%, #06B6D4 25%, #34D399 50%, #FBBF24 75%, #F43F5E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 6px 0;
    }
    .brand-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #64748B;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.3)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 24px rgba(52, 211, 153, 0.5)); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img class="brand-logo" src="favicon.svg" alt="LeakLens Logo" />
    <h1 class="brand-title">LeakLens</h1>
    <div class="brand-subtitle">On-Device Credential Audit • Air-Gapped</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
