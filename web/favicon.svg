<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Google & Cyber Multi-color Gradient -->
    <linearGradient id="multiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="25%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#0B111A"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#multiGrad)" stroke-width="26" opacity="0.35" filter="url(#softGlow)"/>

  <!-- Crisp Multicolor Aperture Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#multiGrad)" stroke-width="22" stroke-linecap="round"/>

  <!-- Aperture Blades (Camera Lens Accent) -->
  <g stroke="url(#multiGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="80" x2="330" y2="170" />
    <line x1="408" y1="168" x2="350" y2="270" />
    <line x1="408" y1="344" x2="280" y2="355" />
    <line x1="256" y1="432" x2="182" y2="342" />
    <line x1="104" y1="344" x2="162" y2="242" />
    <line x1="104" y1="168" x2="232" y2="157" />
  </g>

  <!-- Central Obsidian Shield -->
  <path d="M 256 145 L 340 185 C 340 270 295 330 256 360 C 217 330 172 270 172 185 Z"
        fill="url(#shieldFill)"
        stroke="url(#multiGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Keyhole Top Circle -->
  <circle cx="256" cy="235" r="20" fill="url(#emeraldGrad)"/>

  <!-- Keyhole Slot -->
  <path d="M 248 245 L 264 245 L 268 285 L 244 285 Z" fill="url(#emeraldGrad)"/>

  <!-- Inner Sparkle / Security Beacon -->
  <circle cx="256" cy="235" r="8" fill="#FFFFFF" opacity="0.9"/>
</svg>
