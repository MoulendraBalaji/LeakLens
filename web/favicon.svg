<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Cyber Aperture & Shield Accent Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="28%" stop-color="#06B6D4"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Emerald Glow for Air-Gap Keyhole -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Ambient Glow Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyberGrad)" stroke-width="16" opacity="0.3" filter="url(#outerGlow)"/>

  <!-- Precision Aperture Ring (Camera Lens) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyberGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Aperture Blades (Camera Lens Accent) -->
  <g stroke="url(#cyberGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="92" x2="324" y2="178" />
    <line x1="398" y1="174" x2="344" y2="266" />
    <line x1="398" y1="338" x2="284" y2="346" />
    <line x1="256" y1="420" x2="188" y2="334" />
    <line x1="114" y1="338" x2="168" y2="246" />
    <line x1="114" y1="174" x2="228" y2="166" />
  </g>

  <!-- Central Air-Gapped Security Shield -->
  <path d="M 256 148 L 336 186 C 336 264 294 322 256 352 C 218 322 176 264 176 186 Z"
        fill="url(#shieldGrad)"
        stroke="url(#cyberGrad)"
        stroke-width="9"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Shield Inner Bevel Line -->
  <path d="M 256 168 L 320 198 C 320 256 286 304 256 330 C 226 304 192 256 192 198 Z"
        fill="none"
        stroke="#38BDF8"
        stroke-width="2"
        opacity="0.3"
        stroke-linejoin="round"/>

  <!-- Emerald Keyhole (Privacy & Safe Credentials) -->
  <circle cx="256" cy="234" r="18" fill="url(#emeraldGrad)"/>
  <path d="M 249 242 L 263 242 L 267 278 L 245 278 Z" fill="url(#emeraldGrad)"/>

  <!-- Security Beacon Lens Point -->
  <circle cx="256" cy="234" r="7" fill="#FFFFFF" opacity="0.95"/>
</svg>
