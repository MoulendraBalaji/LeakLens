<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="slab">
      <rect x="0" y="0" width="460" height="460" rx="42"/>
    </clipPath>
  </defs>

  <!-- hard offset shadow -->
  <rect x="32" y="32" width="460" height="460" rx="42" fill="#0B0B0E"/>

  <!-- yellow slab -->
  <rect x="0" y="0" width="460" height="460" rx="42" fill="#FFD400" stroke="#0B0B0E" stroke-width="10"/>

  <!-- inner accent bar (neo-brutalist detail) -->
  <rect x="42" y="352" width="376" height="10" rx="5" fill="#0B0B0E" opacity="0.08"/>

  <!-- "LL" monogram — bold and readable at any size -->
  <text
    x="230"
    y="278"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
    font-weight="900"
    font-size="230"
    letter-spacing="-12"
    fill="#0B0B0E"
  >LL</text>

  <!-- small accent dot -->
  <circle cx="416" cy="78" r="18" fill="#0B0B0E"/>
  <circle cx="416" cy="78" r="10" fill="#FFD400"/>
</svg>
